[workspace]
resolver = "2"
members = ["crates/rl-core", "crates/rl-steam", "crates/rl-server", "app"]

[workspace.package]
version = "3.0.0-dev"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/bap23rd/RustyLauncher"
authors = ["bap23rd"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
dirs = "6"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
